# 기존 서비스는 변경하지 않는다. 별도 프로젝트로 명시적으로 실행한다.
# [홍석환] 사용자 흐름 전용 실행 연결
# 원본 읽기·지표 쓰기·복구 상태를 기존 서비스와 분리한다.
services:
  flow:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ticket-guard-user-flow:dev
    build: ./pipeline
    command: [flow]
    init: true
    restart: "no"
    environment:
      PIPELINE_STATE_MONGO_URI: ${PIPELINE_STATE_MONGO_URI:?Set PIPELINE_STATE_MONGO_URI}
      SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-ticketguard.events.v1}
      # 기존 Spark 정제 그룹(ticketguard-spark-consumer)과 분리
      SPARK_KAFKA_GROUP_ID: ${FLOW_KAFKA_GROUP_ID:-ticketguard-flow-v1}
      RAW_SOURCE_ID: ${RAW_SOURCE_ID:?원본 적재기와 같은 원본 식별자 필요}
      # 선택 · 사전 점검용 · 실시간 경로는 원본 DB 미사용
      FLOW_RAW_MONGO_URI: ${FLOW_RAW_MONGO_URI:-}
      FLOW_TARGET_MONGO_URI: ${FLOW_TARGET_MONGO_URI:?지표 전용 DB 쓰기 연결 필요}
      FLOW_CHECKPOINT_DIR: ${FLOW_CHECKPOINT_DIR:-/checkpoints/flow-v1}
      FLOW_TRIGGER_SECONDS: ${FLOW_TRIGGER_SECONDS:-1}
      FLOW_PRESENCE_SECONDS: ${FLOW_PRESENCE_SECONDS:-30}
      FLOW_GRACE_SECONDS: ${FLOW_GRACE_SECONDS:-300}
      FLOW_MAX_EVENTS: ${FLOW_MAX_EVENTS:-250000}
      SPARK_MAX_OFFSETS_PER_TRIGGER: ${SPARK_MAX_OFFSETS_PER_TRIGGER:-1000}
      FLOW_READ_TIMEOUT_MS: ${FLOW_READ_TIMEOUT_MS:-1000}
      EARLY_MONITOR_ENABLED: ${EARLY_MONITOR_ENABLED:-1}
      EARLY_MONITOR_SECONDS: ${EARLY_MONITOR_SECONDS:-3}
      EARLY_MONITOR_COUNT: ${EARLY_MONITOR_COUNT:-10}
    networks: [kafka, raw, metrics, state]
    volumes: [flow-state:/checkpoints]
    stop_grace_period: 30s
networks:
  state:
    external: true
    name: ${STATE_MONGO_NETWORK:-ticket-guard_state-backend}
  kafka:
    external: true
    name: ${SPARK_KAFKA_NETWORK:-ticket-guard_default}
  raw:
    external: true
    name: ${FLOW_RAW_NETWORK:-ticket-guard-raw_raw-backend}
  metrics:
    external: true
    name: ${SPARK_MONGO_NETWORK:-ticket-guard-workspace-db_mongo-backend}
volumes:
  flow-state:
