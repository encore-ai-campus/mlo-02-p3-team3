# [홍석환] 웹 애플리케이션 지속 통합 검사
# 변경 사항에 대해 의존성 설치와 자동 검증 작업을 수행한다.
name: Django phase 1
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  django:
    env:
      EVENT_PUBLISHER: mock
      TEST_MONGO_URI: mongodb://127.0.0.1:27029/test?directConnection=true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: docker compose -f compose.state-test.yml up -d
      - run: python tools/init_test_mongo.py
      - run: python --version
      - run: python manage.py check
      - run: python manage.py test web -v 2
